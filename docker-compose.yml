services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serba_bisa}
      POSTGRES_USER: ${POSTGRES_USER:-serba_bisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serba_bisa_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - serba-bisa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  serba-bisa-postgres:
